[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:postgres]
; nur wenn EMBEDDED_DB=true (vom Entrypoint exportiert)
command=su-exec postgres %(ENV_PGBIN)s/postgres -D /data/postgres -c listen_addresses=127.0.0.1 -c unix_socket_directories=/run/postgresql
autostart=%(ENV_EMBEDDED_DB)s
autorestart=true
priority=5
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:php-fpm]
command=php-fpm -F
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=sh -c 'while true; do su-exec app php artisan schedule:run --no-interaction >/dev/null 2>&1; sleep 60; done'
directory=/var/www/html
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
