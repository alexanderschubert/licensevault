name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version aus Tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: App-Image (UID 99 / GID 100 für Unraid)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          build-args: |
            UID=99
            GID=100
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/licensevault-app:${{ steps.v.outputs.version }}
      - name: Web-Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/licensevault-web:${{ steps.v.outputs.version }}
      - name: All-in-One-Image (ein Container, für Unraid-Template)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: aio
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/licensevault:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/licensevault:latest
